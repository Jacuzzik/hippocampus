[package]
name = "hippocampus"
version = "0.1.0"
description = "Hippocampus desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "hippocampus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
