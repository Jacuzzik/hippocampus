# Hippocampus settings. Holds no secrets: the Claude API key lives in the OS keychain
# (set it with `python -m core key set`).

settings_version = 1

[vault]
# Folder of Markdown notes. A relative path starts at the repo root.
path = "brains/sample"

[ai]
# "claude", or a preset such as "openai", "xai", "gemini", "groq", "lmstudio" (see ai/providers/openai_compat.py)
provider = "claude"
# Optional: a model ID for the chosen preset. Empty uses the preset's first model.
provider_model = ""
claude_model = "claude-sonnet-5-5"
ollama_host = "http://127.0.0.1:11434"
ollama_model = "qwen2.5:1.5b"
# The assistant pauses after this many tool calls in one request; the user can continue.
max_tool_calls = 20
