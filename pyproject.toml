[project]
name = "hippocampus"
version = "0.1.0"
description = "Local-first desktop second brain: Python sidecar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio==4.15.1",
    "keyring==25.7.0",
    "pyyaml==6.0.3",
    "watchfiles==1.3.0",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "ai", "tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "core", "fixtures", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
timeout = 30
markers = [
    "slow: large-vault timing checks, run with -m slow",
]
