name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uvx ruff check .

      - name: Ruff format
        run: uvx ruff format --check .

      # Placeholder: exit code 5 means no tests were collected, which is
      # expected until the first Python code lands (D2).
      - name: Pytest
        run: |
          set +e
          uvx pytest
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet; treating as pass."
            exit 0
          fi
          exit "$code"

  node:
    name: Node (Prettier, ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Placeholder: the UI package arrives in D1. Until then there is no
      # package.json, Prettier config, or ESLint config to run against.
      - name: Prettier and ESLint
        run: |
          if [ ! -f package.json ]; then
            echo "Skipped: no package.json yet."
            exit 0
          fi
          npm ci
          npx prettier --check .
          npx eslint .
